name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: PHP ${{ matrix.php }} Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run unit tests with coverage
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover coverage.xml --display-deprecations 2>&1

      - name: Enforce 90% line coverage
        run: |
          php -r "
          \$xml = simplexml_load_file('coverage.xml');
          \$metrics = \$xml->project->metrics;
          \$total = (int)\$metrics['statements'];
          \$covered = (int)\$metrics['coveredstatements'];
          if (\$total === 0) { echo 'No statements found in coverage report.\n'; exit(1); }
          \$pct = \$covered / \$total * 100;
          printf('Line coverage: %.2f%% (%d/%d)\n', \$pct, \$covered, \$total);
          if (\$pct < 90) {
            echo 'FAIL: Coverage is below the 90% threshold.\n';
            exit(1);
          }
          echo 'OK: Coverage meets the 90% requirement.\n';
          "
